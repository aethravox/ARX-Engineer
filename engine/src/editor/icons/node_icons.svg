<?xml version="1.0" encoding="UTF-8"?>
<!--
  ARX Editor — Iconos de nodos. Cada uno en 16x16 con la paleta ARX.
  Para cargarlos en Dear ImGui, conviértelos a PNG (resvg/nanosvg) y empáctalos
  en un atlas de textura (32x32 cada celda).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 32" width="256" height="32">

  <!-- Node (generic) — círculo púrpura -->
  <g transform="translate(0,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <circle cx="16" cy="16" r="6" fill="#6B36D9"/>
    <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Node2D — coordenadas 2D cyan -->
  <g transform="translate(32,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <line x1="4" y1="28" x2="28" y2="28" stroke="#1AD9EB" stroke-width="2"/>
    <line x1="4" y1="28" x2="4" y2="4"  stroke="#1AD9EB" stroke-width="2"/>
    <path d="M4 4 L8 8 M4 4 L0 8 M28 28 L24 24 M28 28 L24 32" stroke="#1AD9EB" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="3" fill="#1AD9EB"/>
  </g>

  <!-- Node3D — cubo 3D -->
  <g transform="translate(64,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <path d="M16 4 L28 10 L28 22 L16 28 L4 22 L4 10 Z" fill="none" stroke="#6B36D9" stroke-width="2"/>
    <path d="M16 4 L16 16 L4 10 M16 16 L28 10 M16 16 L16 28" stroke="#6B36D9" stroke-width="2" fill="none"/>
  </g>

  <!-- Sprite2D — sprite con marco -->
  <g transform="translate(96,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <rect x="6" y="6" width="20" height="20" fill="#1AD9EB" opacity="0.3"/>
    <rect x="6" y="6" width="20" height="20" fill="none" stroke="#1AD9EB" stroke-width="2"/>
    <path d="M10 10 L10 22 L22 22" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>

  <!-- MeshInstance3D — cubo con caras -->
  <g transform="translate(128,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <polygon points="16,4 26,12 16,20 6,12" fill="#6B36D9"/>
    <polygon points="16,4 26,12 26,22 16,28" fill="#4A2299"/>
    <polygon points="16,4 6,12 6,22 16,28" fill="#8B55E6"/>
    <polygon points="16,20 26,12 26,22 16,28" fill="#3A1A77"/>
    <polygon points="16,20 6,12 6,22 16,28" fill="#5C2BAA"/>
  </g>

  <!-- Camera3D — cámara -->
  <g transform="translate(160,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <rect x="4" y="10" width="20" height="14" rx="2" fill="none" stroke="#1AD9EB" stroke-width="2"/>
    <polygon points="24,14 30,10 30,24 24,20" fill="#1AD9EB"/>
    <circle cx="14" cy="17" r="3" fill="#1AD9EB" opacity="0.5"/>
  </g>

  <!-- Light3D — bombilla -->
  <g transform="translate(192,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <circle cx="16" cy="13" r="7" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <rect x="13" y="20" width="6" height="3" fill="#888"/>
    <rect x="13" y="23" width="6" height="2" fill="#666"/>
    <line x1="16" y1="6" x2="16" y2="3" stroke="#FFA500" stroke-width="2"/>
    <line x1="9" y1="9" x2="7" y2="7" stroke="#FFA500" stroke-width="2"/>
    <line x1="23" y1="9" x2="25" y2="7" stroke="#FFA500" stroke-width="2"/>
  </g>

  <!-- Script (.arx) — documento con A -->
  <g transform="translate(224,0)">
    <rect width="32" height="32" rx="4" fill="none"/>
    <path d="M8 4 L20 4 L26 10 L26 28 L8 28 Z" fill="#1a1326" stroke="#6B36D9" stroke-width="2"/>
    <path d="M20 4 L20 10 L26 10" fill="none" stroke="#6B36D9" stroke-width="2"/>
    <text x="17" y="22" font-family="Arial Black" font-size="10" font-weight="900"
          fill="#1AD9EB" text-anchor="middle">A</text>
  </g>

</svg>
